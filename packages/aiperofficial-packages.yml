summary: >-
  Aiper publishes NO first-party client library on any registry. There is no Aiper GitHub
  organization (github.com/aiper, /aiperofficial, /aiper-official and /AiperTech all 404), no SDK
  page on aiper.com, and nothing on npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems,
  Packagist or crates.io under an Aiper name. Every package below is an UNOFFICIAL, community
  reverse-engineered client for the Aiper mobile-app cloud (apiamerica/apieurope/apiasia.aiper.com
  plus AWS IoT MQTT). They are recorded because they are the only machine clients that exist for
  this company, and because their existence is itself the evidence that a real cloud API is running
  behind the app - but none of them is published, endorsed, or supported by Aiper.
