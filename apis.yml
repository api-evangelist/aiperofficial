aid: aiperofficial
name: Aiper
description: >-
  Aiper is a consumer robotics company that designs and sells cordless robotic pool cleaners,
  solar-powered pool skimmers and smart yard-care hardware (the Scuba, Surfer/EcoSurfer, Pilot and
  IrriSense lines), sold in more than 7,000 stores across 50+ countries with a US base in The
  Woodlands, Texas. Its devices are paired to the Aiper mobile app, which talks to a regional cloud
  control plane at apiamerica/apieurope/apiasia.aiper.com plus an AWS IoT MQTT layer. That cloud
  surface is a private first-party app backend: Aiper publishes no developer portal, no API
  reference, no SDK and no machine-readable contract, and every anonymous request to those hosts is
  answered with an authentication error. The only clients that speak it are unofficial, community
  reverse-engineered Home Assistant and Homebridge integrations.
